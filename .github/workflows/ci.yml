name: CI

# Runs only what a GitHub-hosted ubuntu runner can actually do: static checks and
# pure-Python unit tests. whisper.cpp, ffmpeg, BlackHole and a Groq key are all
# unavailable here, so anything that needs them (transcription, live capture, the
# digest pass) is out of scope for this workflow and is not exercised.
"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint
        # Scoped to the packaged code, not scripts/ — those predate ruff and are
        # covered by their own syntax checks below (per CONTRIBUTING.md).
        run: ruff check classnotes tests

      - name: Unit tests (no whisper, no network)
        run: pytest -m "not integration" -q

      - name: Shell script syntax check
        run: bash -n scripts/*.sh

      - name: Python compile check (scripts/)
        run: python3 -m py_compile scripts/*.py
