[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classnotes-agent"
version = "0.1.0"
description = "Turn a recorded lecture into structured notes and a rolling per-course exam-prep synthesis."
readme = "README.md"
license = "MIT"
authors = [{ name = "Biswajeet Kumar" }]
requires-python = ">=3.10"
# Standard library only — see CONTRIBUTING.md ("no new dependencies without a reason").
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/biswajeetdev/classnotes-agent"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
classnotes = "classnotes.__main__:main"

[tool.setuptools]
packages = ["classnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs whisper.cpp, ffmpeg, or network access — skipped in CI",
]

[tool.ruff]
target-version = "py310"
line-length = 120

# Pick the rules deliberately rather than inheriting ruff's defaults, which
# broaden between releases -- CI that fails because the linter grew a new
# opinion is not a useful gate. These are the families that catch real defects:
#   E/W  pycodestyle errors      F    pyflakes (unused imports, dead locals)
#   I    import sorting          B    bugbear (real footguns, e.g. late-binding
#                                     closures over loop variables)
#   DTZ  naive datetimes -- this project reports on a schedule declared in IST,
#        and a naive-datetime comparison was the cause of a real bug where
#        classes were reported missed before they had happened.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "DTZ"]
# `l` reads as a digit in some fonts, but it is used consistently here for "line"
# in short comprehensions, where a longer name would not add meaning. Renaming ~10
# of them is churn, not an improvement.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Test code is held to the same correctness rules as the package, but assertion
# helpers and fixture literals legitimately run long.
"tests/*" = ["E501", "B011"]
